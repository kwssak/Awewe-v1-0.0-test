name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build backend
        working-directory: backend
        run: |
          go mod tidy
          go build -trimpath -ldflags="-s -w" -o bin/awewe-panel ./cmd/server

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: awewe-panel-linux-amd64
          path: backend/bin/awewe-panel

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: awewe-panel-linux-amd64
          path: bin

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/awewe-panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
